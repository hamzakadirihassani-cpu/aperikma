<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Admin Aperi'k</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Jost:wght@300;400;500&display=swap">
<style>
/* Espace administrateur : commandes « retrait en magasin » et demandes de carte adhérent (données : Google Sheets) */
:root{
  --ink:#06050a; --ink-2:#0e0b14; --ink-3:#16111f; --line:#272030; --paper:#f4eff7; --mute:#9a90a8;
  --neon:#ff2fb4; --neon-2:#33e6ff; --amber:#ffb547; --ok:#4ade80; --warn:#fbbf24; --ko:#f87171;
  --f-display:"Bodoni Moda",Georgia,serif; --f-body:"Jost",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ink);color:var(--paper);font-family:var(--f-body);font-weight:300;font-size:16px;line-height:1.5;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--neon-2);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:rgba(6,5,10,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:14px;padding-block:12px}
header img{height:28px;filter:drop-shadow(0 0 6px var(--neon))}
header h1{font-family:var(--f-body);font-weight:400;font-size:.78rem;letter-spacing:.24em;text-transform:uppercase;color:var(--mute);margin:0;flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;
  padding:.8em 1.2em;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer;color:var(--paper);text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--mute)}
.btn.main{background:var(--neon);border-color:var(--neon);color:var(--ink);font-weight:500}
.btn:disabled{opacity:.5;cursor:wait}

/* connexion */
.login{min-height:80vh;display:grid;place-items:center;padding:24px 16px}
.login form{width:min(380px,100%);display:grid;gap:14px;background:var(--ink-2);border:1px solid var(--line);border-radius:20px;padding:28px}
.login h2{font-family:var(--f-display);font-weight:400;font-size:1.8rem;margin:0}
.login p{color:var(--mute);margin:0;font-size:.92rem}
.login input{background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:.85em 1em;font-size:1.05rem;letter-spacing:.12em;text-transform:uppercase}
.msg{min-height:1.4em;color:var(--ko);font-size:.9rem;margin:0}

/* chiffres */
main{padding-block:20px 60px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--ink-2);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.kpi small{display:block;color:var(--mute);font-size:.7rem;letter-spacing:.16em;text-transform:uppercase}
.kpi b{display:block;font-family:var(--f-display);font-weight:400;font-size:2rem;line-height:1.15;font-variant-numeric:tabular-nums;margin-top:4px}
.kpi.hot b{color:var(--neon)} .kpi.money b{color:var(--amber)}
.kpi span{color:var(--mute);font-size:.8rem}

/* onglets et filtres */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.tab{border:1px solid var(--line);background:transparent;border-radius:999px;padding:.6em 1.1em;cursor:pointer;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.tab[aria-pressed="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.bar .sp{flex:1}
.bar select,.bar input{background:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:.55em 1em;font-size:.9rem}
.bar input{min-width:0;width:min(240px,100%)}
.maj{color:var(--mute);font-size:.8rem}

/* fiches */
.list{display:grid;gap:10px}
.card{background:var(--ink-2);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:8px}
.card[data-s="Nouvelle"]{border-left-color:var(--neon)}
.card[data-s="En préparation"],.card[data-s="Contactée"]{border-left-color:var(--warn)}
.card[data-s="Prête"],.card[data-s="Payée"]{border-left-color:var(--neon-2)}
.card[data-s="Retirée"],.card[data-s="Carte remise"]{border-left-color:var(--ok);opacity:.8}
.card[data-s="Annulée"]{border-left-color:var(--ko);opacity:.55}
.top{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
.top b{font-family:var(--f-display);font-weight:400;font-size:1.25rem}
.top .num{color:var(--mute);font-size:.8rem;letter-spacing:.12em}
.top .tot{margin-left:auto;font-family:var(--f-display);font-size:1.35rem;color:var(--amber)}
.meta{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--mute);font-size:.88rem}
.meta a{color:var(--paper)}
.meta .cave{color:var(--neon-2)}
.items{margin:0;padding:10px 12px;background:var(--ink);border-radius:10px;white-space:pre-line;font-size:.9rem}
.note{color:var(--warn);font-size:.88rem}
.act{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.act select{background:var(--ink);border:1px solid var(--line);border-radius:999px;padding:.5em .9em}
.act input{flex:1;min-width:160px;background:var(--ink);border:1px solid var(--line);border-radius:999px;padding:.5em .9em;font-size:.9rem}
.act .ok{color:var(--ok);font-size:.82rem}
.empty{color:var(--mute);text-align:center;padding:40px 10px;border:1px dashed var(--line);border-radius:14px}
@media (max-width:560px){header h1{flex:1;font-size:0}header .btn{padding:.7em .9em;font-size:.66rem;letter-spacing:.1em}.top .tot{margin-left:0;width:100%}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a href="./" aria-label="Retour au site"><img src="logo.png" alt="Aperi'k"></a>
    <h1>Espace administrateur</h1>
    <button class="btn" id="refresh" type="button" hidden>Actualiser</button>
    <button class="btn" id="logout" type="button" hidden>Se déconnecter</button>
  </div>
</header>

<section class="login" id="login">
  <form id="loginForm" novalidate>
    <h2>Admin Aperi'k</h2>
    <p>Saisis le code d'accès affiché dans le journal du script Google (fonction <i>installer</i>).</p>
    <input id="code" autocomplete="current-password" autocapitalize="characters" spellcheck="false" placeholder="Code d'accès" aria-label="Code d'accès">
    <button class="btn main" type="submit">Entrer</button>
    <p class="msg" id="loginMsg" role="alert"></p>
  </form>
</section>

<main class="wrap" id="app" hidden>
  <div class="kpis" id="kpis"></div>
  <div class="bar">
    <button class="tab" type="button" data-t="commandes" aria-pressed="true">Commandes</button>
    <button class="tab" type="button" data-t="adherents" aria-pressed="false">Cartes adhérent</button>
    <span class="sp"></span>
    <select id="fCave" aria-label="Filtrer par cave"><option value="">Toutes les caves</option><option>Casablanca</option><option>Marrakech</option></select>
    <select id="fStatut" aria-label="Filtrer par statut"></select>
    <input id="fTexte" type="search" placeholder="Nom, téléphone, n°…" aria-label="Rechercher">
  </div>
  <p class="maj" id="maj"></p>
  <div class="list" id="list"></div>
</main>

<script>
(function(){
  // Même adresse que SHEETS_URL dans index.html (application Web du script Google Sheets)
  const SHEETS_URL = '';
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const dh = n => Number(n || 0).toLocaleString('fr-FR', { maximumFractionDigits: 2 }) + ' DH';
  const quand = iso => iso ? new Date(iso).toLocaleString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
  let cle = '', data = null, onglet = 'commandes', filtreStatut = 'actifs';
  try { cle = sessionStorage.getItem('aperik-admin') || ''; } catch (e) {}

  const api = body => fetch(SHEETS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ type: 'admin', cle, ...body }) })
    .then(r => r.json());

  async function charger() {
    if (!SHEETS_URL) { montrerLogin("Le tableau de bord n'est pas encore relié au Google Sheets (voir le guide)."); return; }
    $('refresh').disabled = true;
    try {
      const j = await api({ action: 'lire' });
      if (!j.ok) { cle = ''; try { sessionStorage.removeItem('aperik-admin'); } catch (e) {} montrerLogin(j.erreur === 'code' ? 'Code incorrect.' : 'Erreur : ' + j.erreur); return; }
      data = j; try { sessionStorage.setItem('aperik-admin', cle); } catch (e) {}
      $('login').hidden = true; $('app').hidden = false; $('refresh').hidden = false; $('logout').hidden = false;
      $('maj').textContent = 'Mis à jour à ' + new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
      rendre();
    } catch (e) {
      montrerLogin('Connexion impossible. Vérifie ta connexion internet et réessaie.');
    } finally { $('refresh').disabled = false; }
  }
  function montrerLogin(m) { $('app').hidden = true; $('login').hidden = false; $('refresh').hidden = true; $('logout').hidden = true; $('loginMsg').textContent = m || ''; }

  function kpis() {
    const C = data.commandes, A = data.adherents, now = new Date();
    const auj = d => { const x = new Date(d); return x.toDateString() === now.toDateString(); };
    const mois = d => { const x = new Date(d); return x.getMonth() === now.getMonth() && x.getFullYear() === now.getFullYear(); };
    const nb = (L, s) => L.filter(x => s.includes(x.Statut)).length;
    const ca = C.filter(x => x.Statut === 'Retirée').reduce((s, x) => s + Number(x['Total (DH)'] || 0), 0);
    const payes = nb(A, ['Payée', 'Carte remise']);
    const k = [
      ['hot', 'À préparer', nb(C, ['Nouvelle', 'En préparation']), 'commandes'],
      ['', 'Prêtes à retirer', nb(C, ['Prête']), 'en attente du client'],
      ['', "Commandes aujourd'hui", C.filter(x => auj(x.Date)).length, C.filter(x => mois(x.Date)).length + ' ce mois-ci'],
      ['money', 'CA retiré', dh(ca), C.length + ' commandes au total'],
      ['hot', 'Adhérents à rappeler', nb(A, ['Nouvelle']), 'demandes de carte'],
      ['money', 'Cartes payées', payes, dh(payes * 399)],
    ];
    $('kpis').innerHTML = k.map(([c, t, v, s]) => `<div class="kpi ${c}"><small>${t}</small><b>${esc(v)}</b><span>${esc(s)}</span></div>`).join('');
  }

  function rendre() {
    kpis();
    const L = onglet === 'commandes' ? data.commandes : data.adherents;
    const statuts = onglet === 'commandes' ? data.statutsCommande : data.statutsAdhesion;
    const fS = $('fStatut');
    fS.innerHTML = '<option value="actifs">En cours</option><option value="">Tous les statuts</option>' + statuts.map(s => `<option>${esc(s)}</option>`).join('');
    fS.value = [...fS.options].some(o => o.value === filtreStatut) ? filtreStatut : 'actifs';
    const fin = onglet === 'commandes' ? ['Retirée', 'Annulée'] : ['Carte remise', 'Annulée'];
    const t = $('fTexte').value.trim().toLowerCase(), cave = $('fCave').value, s = fS.value;
    const vus = L.filter(x => (!cave || x.Cave === cave)
        && (!s || (s === 'actifs' ? !fin.includes(x.Statut) : x.Statut === s))
        && (!t || [x['N°'], x.Prénom, x.Nom, x.Téléphone, x['E-mail']].join(' ').toLowerCase().includes(t)))
      .sort((a, b) => String(b.Date).localeCompare(String(a.Date)));
    $('list').innerHTML = vus.length ? vus.map(x => carte(x, statuts)).join('')
      : `<div class="empty">Aucune ${onglet === 'commandes' ? 'commande' : 'demande'} ${s === 'actifs' ? 'en cours' : 'pour ce filtre'}.</div>`;
  }

  function carte(x, statuts) {
    const tel = String(x.Téléphone || '').replace(/^'/, ''), telIntl = tel.replace(/\D/g, '').replace(/^0/, '212');
    const cmd = onglet === 'commandes';
    return `<article class="card" data-s="${esc(x.Statut)}" data-n="${esc(x['N°'])}">
      <div class="top"><b>${esc(x.Prénom)} ${esc(x.Nom)}</b><span class="num">${esc(x['N°'])} · ${esc(quand(x.Date))}</span>
        ${cmd ? `<span class="tot">${dh(x['Total (DH)'])}</span>` : ''}</div>
      <div class="meta"><span class="cave">${esc(x.Cave)}</span>
        ${cmd && x['Retrait prévu'] ? `<span>Retrait : ${esc(x['Retrait prévu'])}</span>` : ''}
        <a href="tel:${esc(tel)}">${esc(tel)}</a>
        ${telIntl ? `<a href="https://wa.me/${esc(telIntl)}" target="_blank" rel="noopener">WhatsApp</a>` : ''}
        ${x['E-mail'] ? `<a href="mailto:${esc(x['E-mail'])}">${esc(x['E-mail'])}</a>` : ''}</div>
      ${cmd ? `<p class="items">${esc(x.Articles)}</p>` : ''}
      ${cmd && x['Note du client'] ? `<p class="note">Note du client : ${esc(x['Note du client'])}</p>` : ''}
      <div class="act">
        <select aria-label="Statut">${statuts.map(s => `<option ${s === x.Statut ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select>
        <input value="${esc(x['Note interne'])}" placeholder="Note interne (visible seulement ici)" aria-label="Note interne">
        <button class="btn" type="button" data-save>Enregistrer</button><span class="ok" aria-live="polite"></span>
      </div>
    </article>`;
  }

  $('list').addEventListener('click', async e => {
    const b = e.target.closest('[data-save]'); if (!b) return;
    const c = b.closest('.card'), statut = c.querySelector('select').value, note = c.querySelector('.act input').value;
    b.disabled = true; c.querySelector('.ok').textContent = '…';
    try {
      const j = await api({ action: 'statut', numero: c.dataset.n, statut, note });
      if (!j.ok) throw new Error(j.erreur);
      const L = onglet === 'commandes' ? data.commandes : data.adherents, x = L.find(y => String(y['N°']) === c.dataset.n);
      if (x) { x.Statut = statut; x['Note interne'] = note; }
      c.dataset.s = statut; c.querySelector('.ok').textContent = 'Enregistré'; kpis();
    } catch (err) { c.querySelector('.ok').textContent = "Échec, réessaie"; }
    finally { b.disabled = false; }
  });
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    onglet = t.dataset.t; document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-pressed', String(x === t))); filtreStatut = 'actifs'; rendre();
  }));
  $('fCave').addEventListener('change', rendre);
  $('fStatut').addEventListener('change', () => { filtreStatut = $('fStatut').value; rendre(); });
  $('fTexte').addEventListener('input', rendre);
  $('refresh').addEventListener('click', charger);
  $('logout').addEventListener('click', () => { cle = ''; data = null; try { sessionStorage.removeItem('aperik-admin'); } catch (e) {} montrerLogin(''); });
  $('loginForm').addEventListener('submit', e => { e.preventDefault(); cle = $('code').value.trim().toUpperCase(); if (cle) charger(); });

  if (cle) charger(); else montrerLogin(SHEETS_URL ? '' : "Le tableau de bord n'est pas encore relié au Google Sheets (voir le guide).");
})();
</script>
</body>
</html>
