# Configuration Render (Blueprint) pour le site Aperi'k.
# Site statique : aucune compilation, Render sert directement les fichiers du dossier.
services:
  - type: web
    name: aperik
    runtime: static
    # Rien à compiler : on retire seulement les fichiers de travail (Excel, notes) pour ne pas les publier
    buildCommand: rm -rf *.csv *.md render.yaml .gitignore google-sheets
    staticPublishPath: .
    routes:
      # aperik.ma/admin ouvre l'espace administrateur
      - type: rewrite
        source: /admin
        destination: /admin.html
    headers:
      - path: /admin.html
        name: X-Robots-Tag
        value: noindex, nofollow
      # Les photos changent rarement : le navigateur les garde 7 jours
      - path: /photos/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
